<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>見本の目次 | ハッピーランド リニューアル</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/catalog.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span class="eyebrow">ハッピーランド リニューアルの見本</span>
      <h1>見本の目次</h1>
      <p class="lead">画面を押すと、その画面が大きく出ます（← → で同じ分類の前・次、Esc で閉じる）。開いた画面の下の「見本ナビ」でも、前・次の画面に移れます。</p>
      <div class="tools">
        <input id="q" type="search" placeholder="探す（例：OK返事、退会、payment）" aria-label="画面を探す">
        <div class="seg" role="group" aria-label="表示">
          <button id="mode-photo" type="button" aria-pressed="true">画面つき</button>
          <button id="mode-list" type="button" aria-pressed="false">一覧</button>
        </div>
        <span class="count" id="count"></span>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="分類"></nav>
    <div id="cats"></div>
    <div class="missing" id="missing"></div>
    <p class="foot">各メニューの元の目次：
      <a href="search.html">お相手検索</a> ・ <a href="mail.html">メッセージ</a> ・ <a href="favorite.html">いいね</a> ・
      <a href="diary.html">日記</a> ・ <a href="menu-profile.html">プロフィール</a> ・ <a href="payment.html">ポイント購入</a> ・
      <a href="pointget.html">ポイントゲット</a> ・ <a href="setting.html">各種設定</a> ・ <a href="system.html">システム・料金</a> ・ <a href="contact.html">お問合せ</a>
    </p>
  </div>
  <dialog id="viewer" aria-label="画面を大きく見る">
    <div class="v-head">
      <div class="v-title"><b id="v-cat"></b><span id="v-label"></span><code id="v-file"></code></div>
      <button type="button" class="v-close" id="v-close" aria-label="閉じる">×</button>
    </div>
    <div class="v-body">
      <button type="button" class="v-nav" id="v-prev" aria-label="前の画面">←</button>
      <div class="v-phone"><iframe id="v-frame" title="画面"></iframe></div>
      <button type="button" class="v-nav" id="v-next" aria-label="次の画面">→</button>
    </div>
    <div class="v-foot">
      <button type="button" id="v-prev2">← 前</button>
      <a id="v-open" href="#" target="_blank" rel="noopener">このページを開く</a>
      <button type="button" id="v-next2">次 →</button>
    </div>
  </dialog>
  <script src="js/catalog-data.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
